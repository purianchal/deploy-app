apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  deploy:
    steps:
      - name: Register deployed artifact
        uses: cloudbees-io/register-deployed-artifact@v2
        with:
          artifact-id: 71c61aa6-8f23-4195-b03e-5bf91c7a0f7a
          target-environment: ap-test
